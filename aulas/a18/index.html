<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 18 - Prática</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="">
        <h1>Cadastro</h1>
        <div>
            <label for="">Nome</label>
            <input type="text" name="" id="" required>
        </div>
        <div>
            <label for="">Função</label>
            <input type="text" name="" id="" disabled>
        </div>
        <div>
            <label for="">Idade</label>
            <input type="number" name="" id="">
        </div>
    </form>

    <form>
        <h1>Lista de Tarefas</h1>
        <div>
            <input type="checkbox" name="" id="">
            <label for="">Revisar Registros</label>
        </div>
        <div>
            <input type="checkbox" name="" id="">
            <label for="">Alinhar com equipe</label>
        </div>
        <div id="checkbox-solutions">
            <input type="checkbox" name="">
            <label for="">Desenvolver Soluções</label>
        </div>
        <div id="text-solutions">
            <label for="">Soluções</label>
            <input type="text" name="">
        </div>
    </form>

    <section>
        <h1>Links Úteis</h1>
        <ul>
            <li><a href="pages/colaboradores.html">Lista de Colaboradores</a></li>
            <li><a href="pages/tarefas-finalizadas.html">Tarefas Finalizadas</a></li>
        </ul>
    </section>
</body>
</html>
