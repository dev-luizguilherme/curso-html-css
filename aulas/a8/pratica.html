<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial - Netflix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: green;
        }

        nav {
            background-color: #000000;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #logo-netflix {
            display: inline-block;
            width: 100px;
            vertical-align: middle;
        }

        nav ul {
            display: inline-block;
            padding-left: 20px;
        }

        nav ul li {
            display: inline-block;
        }

        nav ul li:not(:first-child) {
            padding-left: 20px;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-family: sans-serif;
        }

        #nav-div-2 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .menu-svg-inline {
            color: white;
            display: inline-block;
        }

        #children-section {
            display: inline-block;
        }

        #children-section img {
            width: 50px;
            vertical-align: middle;
        }

        #children-section * {
            display: inline-block;
        }

        #change-perfil {
            display: inline-block;
        }

        #change-perfil * {
            display: inline-block;
        }

        #change-perfil img {
            width: 50px;
            vertical-align: middle;
        }

        p {
            color: #ffffff;
        }

        #down-arrow {
            fill: #ffffff;
            width: 15px;
        }
    </style>
</head>
<body>
    <nav>
        <div id="nav-div-1">
            <img id="logo-netflix" src="logo-netflix.svg" alt="Logo Netflix">
            <ul>
                <li><a href="">Início</a></li>
                <li><a href="">Séries</a></li>
                <li><a href="">Filmes</a></li>
                <li><a href="">Jogos</a></li>
                <li><a href="">Bombando</a></li>
                <li><a href="">Minha Lista</a></li>
                <li><a href="">Navegar por idiomas</a></li>
            </ul>
        </div>
        
        <div id="nav-div-2">
            <svg class="menu-svg-inline" viewBox="0 0 24 24" width="24" height="24" data-icon="MagnifyingGlassMedium" data-icon-id=":r2:" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Buscar">
                <path fill="currentColor" fill-rule="evenodd" d="M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0m-1.38 7.03a9 9 0 1 1 1.41-1.41l5.68 5.67-1.42 1.42z" clip-rule="evenodd"></path>
            </svg>
            <svg class="menu-svg-inline" viewBox="0 0 24 24" width="24" height="24" data-icon="BellMedium" data-icon-id=":r9:" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Notificações">
                <path fill="currentColor" fill-rule="evenodd" d="M13 4.07A7 7 0 0 1 19 11v4.25q1.58.12 3.1.28l-.2 2a93 93 0 0 0-19.8 0l-.2-2q1.52-.15 3.1-.28V11a7 7 0 0 1 6-6.93V2h2zm4 11.06V11a5 5 0 0 0-10 0v4.13a97 97 0 0 1 10 0m-8.37 4.24C8.66 20.52 10.15 22 12 22s3.34-1.48 3.37-2.63c.01-.22-.2-.37-.42-.37h-5.9c-.23 0-.43.15-.42.37" clip-rule="evenodd"></path>
            </svg>
            <div id="children-section">
                <img src="infantil-icon.png" alt="Ícone Infantil">
                <p>Infantil</p>
            </div>
            <div id="change-perfil">
                <img src="perfil-icon.png" alt="Ícone do Perfil">
                <svg id="down-arrow" viewBox="0 0 386.257 386.257">
                    <polygon points="0,96.879 193.129,289.379 386.257,96.879 "/>
                </svg>
            </div>
        </div>
    </nav>
</body>
</html>
